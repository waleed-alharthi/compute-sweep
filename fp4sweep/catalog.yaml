# Every accelerator family with >= 24 GB of VRAM / unified memory, mainstream
# and odd. First match wins, so specific patterns come before generic ones
# (4090 48G mod before 4090, PRO 6000 before 6000 Ada before RTX 6000).
#   vram   GB per unit (overrides by title); gpu_count multiplies for piles
#   fp     lowest *hardware* float: fp4 | fp8 | fp16 | fp32 (sw = no tensor)
#   bw     GB/s memory bandwidth, the number that sets tokens/s
#   floor  street floor in USD per unit: below it the listing is a scam,
#          a part, a rental or a typo - not a card you can buy
#   reject title regexes that look like a match but are not

# ---------------- NVIDIA Blackwell (native FP4)
- id: rtxpro6000bw
  name: RTX PRO 6000 Blackwell
  vram: 96
  fp: fp4
  bw: 1792
  floor_usd: 5500
  patterns:
    - "rtx\\s*pro\\s*6000"
    - "rtx\\s*6000\\s*pro"
    - "6000.{0,20}blackwell|blackwell.{0,20}6000"
- id: rtxpro5000bw
  name: RTX PRO 5000 Blackwell
  vram: 48
  fp: fp4
  bw: 1344
  floor_usd: 3000
  patterns:
    - "rtx\\s*pro\\s*5000"
    - "5000.{0,20}blackwell"
  vram_overrides:
    - ["72\\s*g", 72]
- id: rtxpro4500bw
  name: RTX PRO 4500 Blackwell
  vram: 32
  fp: fp4
  bw: 896
  floor_usd: 1800
  patterns:
    - "rtx\\s*pro\\s*4500"
- id: rtxpro4000bw
  name: RTX PRO 4000 Blackwell
  vram: 24
  fp: fp4
  bw: 672
  floor_usd: 1100
  patterns:
    - "rtx\\s*pro\\s*4000"
- id: rtx5090
  name: RTX 5090
  vram: 32
  fp: fp4
  bw: 1792
  floor_usd: 1900
  reject: ["laptop", "notebook", "mobile", "5090\\s*d\\b"]
  patterns:
    - "rtx\\s*5090"
    - "geforce\\s*5090"
- id: dgxspark
  name: GB10 box (DGX Spark/GX10)
  vram: 128
  fp: fp4
  bw: 273
  floor_usd: 2700
  patterns:
    - "dgx\\s*spark"
    - "ascent\\s*gx10"
    - "\\bgx10\\b"
    - "\\bgb10\\b"
    - "aorus\\s*atom|gigabyte\\s*atom"
    - "edgexpert"
- id: jetsonthor
  name: Jetson AGX Thor
  vram: 128
  fp: fp4
  bw: 273
  floor_usd: 2500
  reject: ["carrier", "board only", "حاملة", "baseboard"]
  patterns:
    - "jetson\\s*(?:agx)?\\s*thor"

