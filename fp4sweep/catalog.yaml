# ---------------- Intel / Huawei / Tenstorrent
- id: gaudi2
  name: Intel Gaudi 2
  vram: 96
  fp: fp8
  bw: 2450
  floor_usd: 900
  patterns:
    - "gaudi\\s*2"
    - "hl-?225"
- id: arcb60
  name: Arc Pro B60 (24 / dual 48)
  vram: 24
  fp: fp16
  bw: 456
  floor_usd: 450
  patterns:
    - "arc\\s*pro\\s*b60"
    - "\\bb60\\b.{0,20}(?:arc|intel)"
  vram_overrides:
    - ["dual|48\\s*g", 48]
- id: atlas300i
  name: Huawei Atlas 300I Duo 96GB
  vram: 96
  fp: fp16
  bw: 204
  floor_usd: 1000
  note: 2x Ascend 310P, 96GB LPDDR4X total; the two chips' 204 GB/s do NOT
    stack for LLM inference; INT8-capable NPUs but runs GGUF via llama.cpp
    CANN backend; needs CANN/torch-npu, passive card (server airflow)
  patterns:
    - "atlas\\s*300i?\\s*duo"
    - "300i\\s*duo"
- id: tenstorrent
  name: Tenstorrent card
  vram: 32
  fp: fp8
  bw: 512
  floor_usd: 800
  reject: ["tesla", "v100", "p40", "m40", "k80", "quadro"]
  patterns:
    - "tenstorrent"
    - "blackhole\\s*p1[05]0"
    - "wormhole\\s*n[13]"
  vram_overrides:
    - ["p100", 28]
    - ["n300", 24]

